<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>IRON — Gym Tracker</title>
<link rel="manifest" href="/iron_gym/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%230a0a0a'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-family='Arial Black' font-size='240' fill='%23ff3d00' font-weight='900'%3EI%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="IRON">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0a;--s1:#111;--s2:#151515;--s3:#1d1d1d;--bd:#252525;--t1:#eee;--t2:#aaa;--t3:#666;--t4:#444;--ac:#ff3d00;--ac2:#ff6e40;--acg:rgba(255,61,0,.25);--gn:#00e676;--gng:rgba(0,230,118,.2);--yl:#ffd600;--rd:#ff1744;--r:14px;--sb:env(safe-area-inset-bottom,0px)}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--t1);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:0}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}
.scr{display:none;min-height:100dvh;padding-bottom:calc(74px + var(--sb))}.scr.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.hdr{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 10px;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 65%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:5px;color:var(--ac);line-height:1}
.hdr .sub{font-size:9px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-top:2px}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);display:flex;padding-bottom:var(--sb);z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 7px;background:none;border:none;color:var(--t4);font-size:8px;letter-spacing:1px;text-transform:uppercase;transition:.2s}
.nb.on{color:var(--ac)}
.nb svg{width:20px;height:20px}
.cnt{padding:0 16px}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:15px;margin-bottom:10px;position:relative;overflow:hidden;transition:.15s}
.card:active{transform:scale(.98)}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.card h3{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px}
.card .meta{font-size:10px;color:var(--t3);margin-top:4px;display:flex;gap:12px}
.ba{width:100%;padding:13px;background:var(--s2);border:2px dashed var(--bd);border-radius:var(--r);color:var(--t3);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:3px}
.ba:active{border-color:var(--ac);color:var(--ac)}
.bf{background:none;border:none;color:var(--t3);padding:8px;display:flex;align-items:center;justify-content:center}
.bf:active{color:var(--ac)}
.cpills{display:flex;gap:7px;padding:2px 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}.cpills::-webkit-scrollbar{display:none}
.cp{padding:7px 14px;border-radius:50px;border:1px solid var(--bd);background:var(--s2);color:var(--t3);font-size:10px;letter-spacing:1px;white-space:nowrap;flex-shrink:0;transition:.2s}
.cp.on{border-color:var(--ac);color:var(--ac);background:rgba(255,61,0,.07)}
.elc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:11px;margin-bottom:9px;display:flex;gap:12px;align-items:center}
.elc:active{border-color:var(--bd)}
.eth{width:56px;height:56px;border-radius:9px;background:var(--s3);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.eth svg{width:44px;height:44px}
.eif{flex:1;min-width:0}
.eif h4{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eif .mu{font-size:9px;color:var(--ac);letter-spacing:.5px;margin-top:1px}
.eif .ds{font-size:9px;color:var(--t3);margin-top:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eab{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);background:none;color:var(--t3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.eab.ok{border-color:var(--gn);color:var(--gn);background:rgba(0,230,118,.1)}
.shdr{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 65%,transparent)}
.sttl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px}
.sclk{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ac)}
.exb{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.exbh{padding:10px 12px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--bd)}
.exbt{width:36px;height:36px;border-radius:7px;background:var(--s3);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.exbt svg{width:28px;height:28px}
.exbn{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;flex:1}
.th{display:grid;grid-template-columns:32px 1fr 1fr 40px;gap:5px;padding:5px 12px 1px;font-size:8px;color:var(--t4);letter-spacing:1.5px;text-transform:uppercase}
.sr{display:grid;grid-template-columns:32px 1fr 1fr 40px;gap:5px;padding:7px 12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.02)}
.sl{font-size:10px;color:var(--t3);font-weight:600}
.si{background:var(--s3);border:1px solid var(--bd);border-radius:9px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px;text-align:center;outline:none;width:100%;-webkit-appearance:none}
.si:focus{border-color:var(--ac)}
.sd{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:none;display:flex;align-items:center;justify-content:center;color:var(--t4);transition:.2s}
.sd.done{background:var(--gn);border-color:var(--gn);color:var(--bg);box-shadow:0 0 14px var(--gng)}
.as{width:100%;padding:8px;background:none;border:none;border-top:1px solid var(--bd);color:var(--t4);font-size:9px;letter-spacing:1px}
.as:active{color:var(--ac)}
.fb{width:calc(100% - 32px);margin:14px 16px 6px;padding:14px;background:var(--ac);border:none;border-radius:var(--r);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:4px;box-shadow:0 4px 20px var(--acg)}
.fb:active{transform:scale(.97)}
.tov{position:fixed;inset:0;background:rgba(0,0,0,.93);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
.tov.on{display:flex;animation:fi .2s ease}
.tc{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;background:none;border:none;color:var(--t3)}
.trw{position:relative;width:240px;height:240px}
.trs{width:100%;height:100%;transform:rotate(-90deg)}
.trb{fill:none;stroke:var(--s3);stroke-width:5}
.trp{fill:none;stroke:var(--ac);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.trd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.trt{font-family:'Bebas Neue',sans-serif;font-size:66px;letter-spacing:3px;line-height:1}
.trl{font-size:9px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.tps{display:flex;gap:7px;margin-top:32px;flex-wrap:wrap;justify-content:center}
.tp{padding:7px 14px;border-radius:50px;border:1px solid var(--bd);background:var(--s2);color:var(--t3);font-size:11px;transition:.2s}
.tp.on{border-color:var(--ac);color:var(--ac);box-shadow:0 0 10px var(--acg)}
.tcs{display:flex;gap:12px;margin-top:24px}
.tcb{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);background:var(--s2);color:var(--t1);display:flex;align-items:center;justify-content:center}
.tcb.pri{width:60px;height:60px;border-color:var(--ac);background:var(--ac);color:#fff;box-shadow:0 0 22px var(--acg)}
.tcb:active{transform:scale(.9)}
.pill{position:fixed;bottom:calc(74px + var(--sb) + 8px);left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:7px 18px;border-radius:50px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;z-index:90;display:none;box-shadow:0 4px 20px var(--acg);animation:pp 2s ease infinite}
.pill.on{display:block}
@keyframes pp{0%,100%{box-shadow:0 4px 20px var(--acg)}50%{box-shadow:0 4px 35px rgba(255,61,0,.4)}}
.rfab{position:fixed;bottom:calc(74px + var(--sb) + 10px);right:14px;width:48px;height:48px;border-radius:50%;background:var(--s2);border:2px solid var(--ac);color:var(--ac);display:none;align-items:center;justify-content:center;z-index:80;box-shadow:0 4px 16px var(--acg)}
.rfab.vis{display:flex}
.rfab svg{width:20px;height:20px}
.cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cn h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
.cn button{background:none;border:none;color:var(--t3);padding:6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-bottom:16px}
.cdh{font-size:8px;color:var(--t4);letter-spacing:1px;padding:6px 0}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:12px;color:var(--t3);position:relative;transition:.15s}
.cd.tod{color:var(--t1);background:var(--s3);font-weight:700}
.cd.hw{color:var(--ac);font-weight:600}
.cd.hw::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
.cd.oth{opacity:.2}
.cd.sel{background:var(--ac);color:#fff}.cd.sel::after{background:#fff}
.strow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stb{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:12px;text-align:center}
.stv{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--ac)}
.stl{font-size:7px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.av{width:74px;height:74px;border-radius:50%;background:var(--s3);border:3px solid var(--ac);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--ac)}
.pn{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px}
.ps{text-align:center;font-size:9px;color:var(--t3);letter-spacing:1.5px;margin-top:3px}
.skb{background:linear-gradient(135deg,rgba(255,61,0,.1),rgba(255,110,64,.05));border:1px solid rgba(255,61,0,.18);border-radius:var(--r);padding:18px;text-align:center;margin:16px 0}
.skn{font-family:'Bebas Neue',sans-serif;font-size:44px;color:var(--ac);line-height:1}
.skl{font-size:9px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.psec{margin-top:20px}
.psec h3{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--t3);margin-bottom:8px}
.pr{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.pr label{font-size:11px;color:var(--t2)}
.pi{background:none;border:none;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;outline:none;width:90px}
.pi::placeholder{color:var(--t4)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.ms{background:var(--s1);border-radius:18px 18px 0 0;width:100%;max-width:500px;padding:18px 18px calc(18px + var(--sb));animation:su .25s ease;max-height:82vh;overflow-y:auto}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.ms h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;margin-bottom:14px}
.mi{width:100%;padding:11px 12px;background:var(--s3);border:1px solid var(--bd);border-radius:11px;color:var(--t1);font-size:13px;outline:none;margin-bottom:8px}
.mi:focus{border-color:var(--ac)}
.mi::placeholder{color:var(--t4)}
.mb{display:flex;gap:7px;margin-top:6px}
.mc{flex:1;padding:12px;border-radius:11px;border:none;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px}
.mcn{background:var(--s3);color:var(--t3)}
.mok{background:var(--ac);color:#fff}
.tabs{display:flex;margin-bottom:14px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.tab{flex:1;padding:9px;background:none;border:none;color:var(--t4);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;transition:.2s}
.tab.on{background:var(--ac);color:#fff}
.tc2{background:var(--s3);border:1px solid var(--bd);border-radius:11px;padding:12px;margin-bottom:7px;cursor:pointer;transition:.15s}
.tc2:active{border-color:var(--ac)}
.tc2 h4{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px}
.tc2 .te{font-size:9px;color:var(--t3);margin-top:3px;line-height:1.4}
.sw{position:relative;margin-bottom:10px}
.sw input{width:100%;padding:10px 12px 10px 34px;background:var(--s2);border:1px solid var(--bd);border-radius:11px;color:var(--t1);font-size:12px;outline:none}
.sw input:focus{border-color:var(--ac)}
.sw input::placeholder{color:var(--t4)}
.sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--t4)}
.empty{text-align:center;padding:40px 20px;color:var(--t4)}
.empty p{font-size:10px;letter-spacing:1px;line-height:1.8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.shake{animation:shake .15s ease 3}
.del-wk{position:absolute;right:10px;top:10px;background:none;border:none;color:var(--t4);padding:4px;z-index:2;opacity:.6}
.del-wk:active{color:var(--rd);opacity:1}
</style>
</head>
<body>
<!-- HOME -->
<div id="scr-home" class="scr on">
<div class="hdr"><h1>IRON</h1><div class="sub">Трекер тренировок</div></div>
<div class="cnt">
<div class="strow" id="hstats"></div>
<div id="wklist"></div>
<button class="ba" onclick="showNewM()">+ НОВАЯ ТРЕНИРОВКА</button>
</div></div>

<!-- LIBRARY -->
<div id="scr-lib" class="scr">
<div class="hdr"><h1>УПРАЖНЕНИЯ</h1><div class="sub">Библиотека</div></div>
<div class="cnt">
<div class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="lsrch" placeholder="Поиск упражнений..." oninput="renderLib()"></div>
<div class="cpills" id="lcpills"></div>
<div id="llib"></div>
</div></div>

<!-- SESSION -->
<div id="scr-sess" class="scr">
<div class="shdr">
<button class="bf" onclick="confirmEnd()"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
<div class="sttl" id="stitle"></div>
<div class="sclk" id="sclk">00:00</div>
</div>
<div class="cnt" id="exlist"></div>
<button class="ba" style="margin:0 16px 8px" onclick="openPicker()">+ ДОБАВИТЬ УПРАЖНЕНИЕ</button>
<button class="fb" onclick="finishSess()">ЗАВЕРШИТЬ</button>
<button class="rfab vis" id="rfab" onclick="openTmr()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button>
</div>

<!-- CALENDAR -->
<div id="scr-cal" class="scr">
<div class="hdr"><h1>КАЛЕНДАРЬ</h1><div class="sub">Расписание</div></div>
<div class="cnt">
<div class="cn"><button onclick="calP()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2 id="cmon"></h2><button onclick="calN()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button></div>
<div class="cg" id="cgrid"></div>
<div id="csum"></div>
</div></div>

<!-- PROFILE -->
<div id="scr-prof" class="scr">
<div class="hdr"><h1>ПРОФИЛЬ</h1><div class="sub">Личный кабинет</div></div>
<div class="cnt">
<div class="av" id="pav">A</div>
<input class="mi" id="pname" placeholder="Ваше имя" style="text-align:center;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;margin-bottom:4px;background:none;border:none" onchange="saveProf()">
<div class="ps">Участник с <span id="psince"></span></div>
<div class="skb"><div class="skn" id="pstreak">0</div><div class="skl">🔥 дней подряд</div></div>
<div class="strow" id="pstats"></div>
<div class="psec"><h3>ПАРАМЕТРЫ ТЕЛА</h3>
<div class="pr"><label>Вес (кг)</label><input class="pi" id="pw" placeholder="—" onchange="saveProf()"></div>
<div class="pr"><label>Рост (см)</label><input class="pi" id="ph" placeholder="—" onchange="saveProf()"></div>
<div class="pr"><label>Возраст</label><input class="pi" id="pa" placeholder="—" onchange="saveProf()"></div>
</div>
<div class="psec"><h3>ТАЙМЕР ОТДЫХА</h3>
<div class="pr"><label>По умолчанию (сек)</label><input class="pi" id="prest" placeholder="90" type="number" onchange="saveProf()"></div>
</div>
<div class="psec"><h3>ДАННЫЕ</h3>
<div class="pr" style="cursor:pointer" onclick="exportD()"><label>Экспорт данных</label><span style="color:var(--ac);font-size:11px">→</span></div>
<div class="pr" style="cursor:pointer" onclick="clearAll()"><label style="color:var(--rd)">Сбросить всё</label><span style="color:var(--rd);font-size:11px">✕</span></div>
</div>
</div></div>

<!-- TIMER OVERLAY -->
<div class="tov" id="tov">
<button class="tc" onclick="closeTmr()"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<div class="trw"><svg class="trs" viewBox="0 0 200 200"><circle class="trb" cx="100" cy="100" r="90"/><circle class="trp" id="tprog" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="0"/></svg>
<div class="trd"><div class="trt" id="ttime">1:30</div><div class="trl">ОТДЫХ</div></div></div>
<div class="tps">
<button class="tp" onclick="setTP(30)">0:30</button>
<button class="tp" onclick="setTP(60)">1:00</button>
<button class="tp on" onclick="setTP(90)">1:30</button>
<button class="tp" onclick="setTP(120)">2:00</button>
<button class="tp" onclick="setTP(180)">3:00</button>
</div>
<div class="tcs">
<button class="tcb" onclick="resetTmr()"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15A9 9 0 1 0 3 9"/></svg></button>
<button class="tcb pri" onclick="togTmr()"><svg width="20" height="20" fill="currentColor" id="tico"><polygon points="8,5 20,12 8,19"/></svg></button>
<button class="tcb" onclick="adjTmr(15)"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><text x="1" y="13" font-size="11" fill="currentColor" stroke="none" font-family="JetBrains Mono">+15</text></svg></button>
</div></div>
<div class="pill" id="pill" onclick="openTmr()"><span id="pillt">1:30</span> ОТДЫХ</div>

<!-- NEW WORKOUT MODAL -->

function startSess(idx){
  sess={wi:idx,exs:JSON.parse(JSON.stringify(W[idx].exercises))};
  if(!sess.exs.length)sess.exs.push({id:null,n:'',sets:[{w:'',r:'',d:false}]});
  ss=Date.now();
  document.getElementById('stitle').textContent=W[idx].name;
  renderEx();
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-sess').classList.add('on');
  document.getElementById('bnav').style.display='none';
  si=setInterval(()=>{const e=Math.floor((Date.now()-ss)/1000);document.getElementById('sclk').textContent=`${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`},1000);
}
function renderEx(){
  document.getElementById('exlist').innerHTML=sess.exs.map((ex,ei)=>{
    const edb=EX.find(x=>x.id===ex.id);
    const thumb=edb?edb.s:'';
    return`<div class="exb"><div class="exbh">${thumb?`<div class="exbt">${thumb}</div>`:''}<div class="exbn">${ex.n||'Упражнение'}</div><button class="bf" onclick="delEx(${ei})"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></div><div class="th"><span>СЕТ</span><span>ВЕС</span><span>ПОВТ</span><span></span></div>${ex.sets.map((s,si)=>`<div class="sr"><span class="sl">${si+1}</span><input class="si" type="number" inputmode="decimal" value="${s.w}" placeholder="—" onchange="uS(${ei},${si},'w',this.value)"><input class="si" type="number" inputmode="numeric" value="${s.r}" placeholder="—" onchange="uS(${ei},${si},'r',this.value)"><button class="sd${s.d?' done':''}" onclick="togS(${ei},${si})"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7l3 3 5-5"/></svg></button></div>`).join('')}<button class="as" onclick="addS(${ei})">+ Добавить сет</button></div>`;
  }).join('');
}
function uS(ei,si,k,v){sess.exs[ei].sets[si][k]=v}
function togS(ei,si){const s=sess.exs[ei].sets[si];s.d=!s.d;renderEx();if(s.d){vib();autoTmr()}}
function addS(ei){const sets=sess.exs[ei].sets;const l=sets[sets.length-1]||{w:'',r:''};sets.push({w:l.w,r:l.r,d:false});renderEx()}

function pickEx(id){const e=EX.find(x=>x.id===id);if(!e)return;sess.exs.push({id:e.id,n:e.n,sets:[{w:'',r:'',d:false},{w:'',r:'',d:false},{w:'',r:'',d:false}]});renderEx();renderPicker()}
function confirmEnd(){if(confirm('Выйти без сохранения?'))endSess()}
function finishSess(){
  const el=Math.floor((Date.now()-ss)/1000);
  const exs=sess.exs.filter(e=>e.n&&e.sets.some(s=>s.d));
  if(exs.length){
    const ts=exs.reduce((a,e)=>a+e.sets.filter(s=>s.d).length,0);
    const tv=exs.reduce((a,e)=>a+e.sets.filter(s=>s.d).reduce((b,s)=>b+(parseFloat(s.w)||0)*(parseInt(s.r)||0),0),0);
    H.unshift({name:W[sess.wi].name,date:new Date().toISOString(),dur:el,exs,ts,tv});sH();
    W[sess.wi].exercises=sess.exs.filter(e=>e.n);W[sess.wi].lu=new Date().toISOString();sW();
  }
  endSess();
}

// ============ TIMER ============
function openTmr(){document.getElementById('tov').classList.add('on');document.getElementById('pill').classList.remove('on');updTD()}
function closeTmr(){document.getElementById('tov').classList.remove('on');if(tOn)document.getElementById('pill').classList.add('on')}
function setTP(s){tD=s;tR=s;tOn=false;clearInterval(tI);updTD();document.querySelectorAll('.tp').forEach(b=>{const v=b.textContent.split(':');const t=+v[0]*60+ +v[1];b.classList.toggle('on',t===tD)});updIco()}
function togTmr(){tOn?pauseTmr():startTmr()}
function startTmr(){if(tR<=0)tR=tD;tOn=true;updIco();tI=setInterval(()=>{tR=Math.max(0,tR-.1);updTD();updPill();if(tR<=0)tmrDone()},100)}
function pauseTmr(){tOn=false;clearInterval(tI);updIco()}
function stopTmr(){tOn=false;clearInterval(tI);tR=tD;document.getElementById('pill').classList.remove('on');document.getElementById('tov').classList.remove('on')}
function resetTmr(){clearInterval(tI);tOn=false;tR=tD;updTD();updIco()}
function adjTmr(s){tR=Math.max(0,tR+s);if(!tOn)tD=Math.max(0,tD+s);updTD()}
function autoTmr(){tR=tD;openTmr();startTmr()}
function tmrDone(){
  clearInterval(tI);tOn=false;updIco();document.getElementById('pill').classList.remove('on');
  vib([200,100,200,100,200]);
  document.getElementById('ttime').classList.add('shake');setTimeout(()=>document.getElementById('ttime').classList.remove('shake'),600);
  try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.15,.3].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.3,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d+.12);o.start(c.currentTime+d);o.stop(c.currentTime+d+.12)})}catch(e){}
}
function updTD(){
  const m=Math.floor(tR/60),s=Math.floor(tR%60);
  document.getElementById('ttime').textContent=`${m}:${String(s).padStart(2,'0')}`;
  document.getElementById('tprog').style.strokeDashoffset=CI*(1-(tD>0?tR/tD:1));
  document.getElementById('tprog').style.stroke=tR<=5&&tOn?'var(--rd)':tR<=15&&tOn?'var(--yl)':'var(--ac)';
}
function updPill(){const m=Math.floor(tR/60),s=Math.floor(tR%60);document.getElementById('pillt').textContent=`${m}:${String(s).padStart(2,'0')}`}
function updIco(){document.getElementById('tico').innerHTML=tOn?'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>':'<polygon points="8,5 20,12 8,19"/>'}
function vib(p){if(navigator.vibrate)navigator.vibrate(p||50)}

// ============ CALENDAR ============
function renderCal(){
  const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('cmon').textContent=`${MN[cM]} ${cY}`;
  const first=new Date(cY,cM,1);let sd=first.getDay();if(sd===0)sd=7;sd--;
  const dim=new Date(cY,cM+1,0).getDate();
  const dip=new Date(cY,cM,0).getDate();
  const today=new Date();
  const wds=new Set();
  H.forEach(h=>{const d=new Date(h.date);if(d.getFullYear()===cY&&d.getMonth()===cM)wds.add(d.getDate())});
  let html='';
  ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d=>html+=`<div class="cdh">${d}</div>`);
  for(let i=sd-1;i>=0;i--)html+=`<div class="cd oth">${dip-i}</div>`;
  for(let d=1;d<=dim;d++){
    const t=d===today.getDate()&&cM===today.getMonth()&&cY===today.getFullYear();
    const hw=wds.has(d);
    const sel=cSel===d;
    html+=`<div class="cd${t?' tod':''}${hw?' hw':''}${sel?' sel':''}" onclick="selDay(${d})">${d}</div>`;
  }
  const tot=sd+dim;const rem=tot%7?7-tot%7:0;
  for(let i=1;i<=rem;i++)html+=`<div class="cd oth">${i}</div>`;
  document.getElementById('cgrid').innerHTML=html;
  renderCalSum();
}
function renderCalSum(){
  const sum=document.getElementById('csum');
  if(cSel!==null){
    const dw=H.filter(h=>{const d=new Date(h.date);return d.getFullYear()===cY&&d.getMonth()===cM&&d.getDate()===cSel});
    if(!dw.length){sum.innerHTML=`<div class="empty"><p>Нет тренировок ${cSel} числа</p></div>`;return}
    sum.innerHTML=dw.map(h=>`<div class="card" style="cursor:default"><h3>${h.name}</h3><div class="meta"><span>${h.ts||0} сетов</span><span>${Math.round(h.tv||0)} кг</span><span>${Math.floor((h.dur||0)/60)} мин</span></div></div>`).join('');
    return;
  }
  const mw=H.filter(h=>{const d=new Date(h.date);return d.getFullYear()===cY&&d.getMonth()===cM});
  if(mw.length){
    const tv=mw.reduce((a,h)=>a+(h.tv||0),0);const ts=mw.reduce((a,h)=>a+(h.ts||0),0);
    sum.innerHTML=`<div class="strow"><div class="stb"><div class="stv">${mw.length}</div><div class="stl">Тренировок</div></div><div class="stb"><div class="stv">${ts}</div><div class="stl">Сетов</div></div><div class="stb"><div class="stv">${tv>1e3?(tv/1e3).toFixed(1)+'т':Math.round(tv)+'кг'}</div><div class="stl">Объём</div></div></div>`;
  }else{sum.innerHTML='<div class="empty"><p>Нет тренировок в этом месяце</p></div>'}
}
function selDay(d){cSel=cSel===d?null:d;renderCal()}
function calP(){cSel=null;cM--;if(cM<0){cM=11;cY--}renderCal()}
function calN(){cSel=null;cM++;if(cM>11){cM=0;cY++}renderCal()}

// ============ PROFILE ============
function renderProf(){
  document.getElementById('pname').value=P.name;
  document.getElementById('pav').textContent=P.name.charAt(0).toUpperCase();
  document.getElementById('psince').textContent=fds(P.joined);
  document.getElementById('pw').value=P.w||'';
  document.getElementById('ph').value=P.h||'';
  document.getElementById('pa').value=P.a||'';
  document.getElementById('prest').value=P.rest||90;
  document.getElementById('pstreak').textContent=calcStreak();
  const tt=H.reduce((a,h)=>a+(h.dur||0),0);const tv=H.reduce((a,h)=>a+(h.tv||0),0);
  document.getElementById('pstats').innerHTML=`<div class="stb"><div class="stv">${H.length}</div><div class="stl">Тренировок</div></div><div class="stb"><div class="stv">${Math.round(tt/3600)}ч</div><div class="stl">Время</div></div><div class="stb"><div class="stv">${tv>1e3?(tv/1e3).toFixed(1)+'т':Math.round(tv)+'кг'}</div><div class="stl">Тоннаж</div></div>`;
}
function calcStreak(){
  if(!H.length)return 0;
  const days=new Set();H.forEach(h=>{const d=new Date(h.date);days.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)});
  let streak=0;const now=new Date();
  for(let i=0;i<365;i++){const d=new Date(now);d.setDate(d.getDate()-i);if(days.has(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`))streak++;else if(i>0)break}
  return streak;
}
function saveProf(){
  P.name=document.getElementById('pname').value.trim()||'АТЛЕТ';
  P.w=document.getElementById('pw').value;P.h=document.getElementById('ph').value;
  P.a=document.getElementById('pa').value;P.rest=parseInt(document.getElementById('prest').value)||90;
  tD=P.rest;tR=tD;sP();
}
function exportD(){const d=JSON.stringify({W,H,P},null,2);const b=new Blob([d],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='iron_backup.json';a.click()}
function clearAll(){if(!confirm('Удалить ВСЕ данные?'))return;localStorage.clear();W=[];H=[];P={name:'АТЛЕТ',w:'',h:'',a:'',rest:90,joined:new Date().toISOString()};sP();go('home')}

// ============ UTILS ============
function fds(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}

// ============ INIT ============
renderHome();
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
document.getElementById('wkn').addEventListener('keydown',e=>{if(e.key==='Enter')createWk()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/iron_gym/sw.js',{scope:'/iron_gym/'}).catch(()=>{});
</script>
